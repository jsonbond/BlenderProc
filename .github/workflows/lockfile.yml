name: Lockfile

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pinned CC0 test assets
        uses: actions/cache@v4
        with:
          path: resources/.test-asset-cache
          key: cc0-test-assets-${{ hashFiles('blenderproc/scripts/test_assets.lock.json') }}
      - name: Fetch pinned CC0 test assets
        run: python blenderproc/scripts/fetch_test_assets.py
      - name: Install Blender 4.2.1 after the official checksum
        run: |
          set -euo pipefail
          base="https://download.blender.org/release/Blender4.2"
          dest="${RUNNER_TEMP}/blender"
          mkdir -p "$dest"
          # The per-archive .sha256 URL is not published. The release checksum file is.
          curl -fsSL -A "Mozilla/5.0" -o "$dest/blender-4.2.1.sha256" "$base/blender-4.2.1.sha256"
          curl -fL --retry 3 -A "Mozilla/5.0" -o "$dest/blender-4.2.1-linux-x64.tar.xz" "$base/blender-4.2.1-linux-x64.tar.xz"
          grep 'blender-4.2.1-linux-x64.tar.xz$' "$dest/blender-4.2.1.sha256" | (cd "$dest" && sha256sum -c -)
          tar -xJf "$dest/blender-4.2.1-linux-x64.tar.xz" -C "$dest"
          "$dest/blender-4.2.1-linux-x64/blender" --version
      - name: Install from the hashed lock
        run: python blenderproc/scripts/install_from_lock.py
      - name: Install this project without unpinned dependencies
        run: python -m pip install -e . --no-deps --no-build-isolation
      - name: Fail if the lock is out of sync
        run: |
          cp requirements.lock /tmp/requirements.lock.orig
          uv pip compile requirements.in --universal --generate-hashes --config-file uv.toml -o requirements.lock >/tmp/uv-compile.txt
          diff -q /tmp/requirements.lock.orig requirements.lock
      - name: Import locked dependencies
        run: python -c "import yaml, requests, matplotlib, numpy, PIL, h5py, progressbar"
      - name: Install libraries Blender needs to start headless
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libxrender1 libxi6 libxxf86vm1 libxfixes3 libxkbcommon0 libsm6
      - name: Run unit tests
        run: python -m blenderproc run tests/run_all.py --custom-blender-path "${{ runner.temp }}/blender/blender-4.2.1-linux-x64"
